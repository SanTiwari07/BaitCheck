name: BaitCheck CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check server and modules
        run: |
          node --check server.js
          for f in src/*.js src/routes/*.js public/js/*.js public/js/views/*.js; do
            [ -f "$f" ] && node --check "$f" || true
          done

      - name: Run unit and API integration tests
        run: node --test tests/forensic.test.js tests/api.test.js tests/storage.test.js tests/db.test.js

      - name: Run browser E2E suite when Chromium is available
        if: matrix.node-version == 22
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            node --test tests/e2e.test.js
          else
            echo "Headless browser binary unavailable on runner; skipping CDP E2E."
          fi

      - name: Production dependency vulnerability check
        run: npm audit --omit=dev
