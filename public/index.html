<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f8f6" />
  <meta name="description" content="A friendly scam-safety practice app for families. Learn to spot suspicious calls, messages, links, QR codes and payment requests." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BaitCheck - Scam Safety Practice for Every Age" />
  <meta property="og:description" content="Practice spotting scam calls, messages and payment requests with short, safe examples for every age." />
  <meta property="og:image" content="/assets/social-card.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>BaitCheck - Scam Safety Practice for Every Age</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="safety-ribbon" role="status" aria-live="polite">
    <span id="safety-ribbon-text">SIMULATION • EDUCATIONAL SCAM DRILL - NO REAL DATA, OTPs, OR DOWNLOADS</span>
  </div>

  <header class="top-nav">
    <div class="top-nav-inner">
      <div class="top-nav-row">
        <button type="button" id="brand-home-btn" class="brand-stamp" aria-label="BaitCheck Home">
          BAITCHECK
        </button>

        <div class="nav-controls">
          <div class="lang-toggle" role="group" aria-label="Language Switcher">
            <button type="button" id="lang-en-btn" class="lang-btn is-active" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" id="lang-hi-btn" class="lang-btn" data-lang="hi" aria-pressed="false">हिंदी</button>
          </div>
          <button type="button" id="sound-toggle-btn" class="sound-btn" aria-label="Toggle sound" aria-pressed="true">
            <span id="sound-toggle-label">SOUND: ON</span>
          </button>
          <button type="button" id="text-size-toggle-btn" class="sound-btn text-size-btn" aria-pressed="false" aria-label="Use larger text">A+</button>
        </div>
      </div>

      <nav class="tab-bar" aria-label="Main menu">
        <button type="button" id="tab-drill-btn" class="tab-btn is-active" data-tab="drill" aria-current="page">
          <svg class="tab-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          <span id="tab-drill-label">PRACTICE</span>
        </button>
        <button type="button" id="tab-xray-btn" class="tab-btn" data-tab="xray">
          <svg class="tab-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <span id="tab-xray-label">CHECK A MESSAGE</span>
        </button>
        <button type="button" id="tab-challenge-btn" class="tab-btn" data-tab="challenge">
          <svg class="tab-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span id="tab-challenge-label">FAMILY PRACTICE</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <div class="workspace-grid">
      <section class="stage-column" aria-live="polite">
        <div id="view-drill" class="view-panel"></div>
        <div id="view-xray" class="view-panel is-hidden"></div>
        <div id="view-challenge" class="view-panel is-hidden"></div>
        <div id="view-report" class="view-panel is-hidden"></div>
      </section>

      <aside class="companion-column" aria-label="Emergency safety guide">
        <section id="playbook-panel" class="playbook-band" aria-labelledby="playbook-heading"></section>
        <section id="cohort-panel" class="cohort-band" aria-labelledby="cohort-heading" hidden></section>
      </aside>
    </div>
  </main>

  <footer class="colophon-footer">
    <div class="colophon-inner">
      <div class="colophon-brand">
        <span class="brand-stamp">BAITCHECK</span>
        <span class="mono-tag">baitcheck.embarko.app</span>
      </div>
      <p id="footer-disclaimer" class="colophon-copy">
        Practice with fictional examples. Never share passwords, one-time codes, or bank details.
      </p>
    </div>
  </footer>

  <script src="/js/i18n.js" defer></script>
  <script src="/js/state.js" defer></script>
  <script src="/js/dom.js" defer></script>
  <script src="/js/audio.js" defer></script>
  <script src="/js/ticketCanvas.js" defer></script>
  <script src="/js/views/companion.js" defer></script>
  <script src="/js/views/xray.js" defer></script>
  <script src="/js/views/challenge.js" defer></script>
  <script src="/js/views/report.js" defer></script>
  <script src="/js/scenarios.js" defer></script>
  <script src="/js/views/simulator.js" defer></script>
  <script src="/js/views/drill.js" defer></script>
  <script src="/js/main.js" defer></script>
</body>
</html>
