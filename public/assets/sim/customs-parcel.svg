<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Simulated customs hold parcel box">
  <defs>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="boxFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#b07d4f" />
    </linearGradient>
  </defs>

  <!-- Warehouse Wall & Table -->
  <rect width="600" height="220" fill="#181c22" />
  <rect y="220" width="600" height="120" fill="url(#tableGrad)" />
  <rect y="218" width="600" height="4" fill="#6b7280" />

  <!-- 3D Parcel Box -->
  <polygon points="105,120 355,120 420,86 170,86" fill="#e2b98a" stroke="#5c3d22" stroke-width="2" />
  <rect x="105" y="120" width="250" height="156" fill="url(#boxFront)" stroke="#5c3d22" stroke-width="2" />
  <polygon points="355,120 420,86 420,238 355,276" fill="#9c6b40" stroke="#5c3d22" stroke-width="2" />

  <!-- Packing Tape -->
  <polygon points="212,86 248,86 218,120 182,120" fill="#e5d5b5" opacity="0.85" />
  <rect x="182" y="120" width="36" height="48" fill="#e5d5b5" opacity="0.85" />

  <!-- Shipping Label -->
  <rect x="128" y="176" width="144" height="80" fill="#ffffff" stroke="#0d0d0d" stroke-width="1.5" />
  <text x="138" y="194" fill="#0d0d0d" font-family="Consolas, monospace" font-weight="700" font-size="11">TRACK: IND-EXP-7749</text>
  <rect x="138" y="202" width="120" height="4" fill="#334155" />
  <rect x="138" y="212" width="90" height="4" fill="#64748b" />
  <g transform="translate(138, 224)">
    <rect x="0" y="0" width="3" height="22" fill="#0d0d0d" />
    <rect x="6" y="0" width="2" height="22" fill="#0d0d0d" />
    <rect x="11" y="0" width="5" height="22" fill="#0d0d0d" />
    <rect x="19" y="0" width="2" height="22" fill="#0d0d0d" />
    <rect x="24" y="0" width="6" height="22" fill="#0d0d0d" />
    <rect x="33" y="0" width="3" height="22" fill="#0d0d0d" />
    <rect x="40" y="0" width="4" height="22" fill="#0d0d0d" />
    <rect x="48" y="0" width="2" height="22" fill="#0d0d0d" />
    <rect x="53" y="0" width="5" height="22" fill="#0d0d0d" />
    <rect x="61" y="0" width="3" height="22" fill="#0d0d0d" />
  </g>

  <!-- Red Customs Hold Tag -->
  <g transform="translate(274, 152) rotate(-7)">
    <rect x="0" y="0" width="130" height="58" fill="#d92d20" stroke="#ffffff" stroke-width="2" />
    <text x="65" y="24" text-anchor="middle" fill="#ffffff" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="16">CUSTOMS HOLD</text>
    <text x="65" y="43" text-anchor="middle" fill="#fec917" font-family="Consolas, monospace" font-weight="700" font-size="12">FEE DUE: ₹1,850</text>
  </g>

  <!-- Right Side Portal Card Overlay -->
  <rect x="438" y="54" width="142" height="218" fill="#fcfaf6" stroke="#0d0d0d" stroke-width="2.5" />
  <rect x="438" y="54" width="142" height="36" fill="#0d0d0d" />
  <text x="509" y="76" text-anchor="middle" fill="#fec917" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="13">EXPRESS PORTAL</text>
  <text x="450" y="114" fill="#d92d20" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="14">PARCEL SEIZED</text>
  <text x="450" y="134" fill="#1e1e1c" font-family="Arial, sans-serif" font-size="11">Missing KYC &amp;</text>
  <text x="450" y="149" fill="#1e1e1c" font-family="Arial, sans-serif" font-size="11">Customs Duty.</text>
  <rect x="450" y="168" width="118" height="38" fill="#fef3f2" stroke="#d92d20" stroke-width="1" />
  <text x="509" y="191" text-anchor="middle" fill="#b42318" font-family="Consolas, monospace" font-weight="700" font-size="12">PAY ₹1,850 NOW</text>
  <rect x="450" y="218" width="118" height="34" fill="#fec917" stroke="#0d0d0d" stroke-width="1.5" />
  <text x="509" y="239" text-anchor="middle" fill="#0d0d0d" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="12">CLEAR PARCEL</text>
</svg>
