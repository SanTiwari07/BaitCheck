<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Simulated forged Cyber Lock and Digital Arrest notice">
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcfaf2" />
      <stop offset="100%" stop-color="#efeadd" />
    </linearGradient>
  </defs>

  <!-- Outer Dark Desk Surface -->
  <rect width="600" height="420" fill="#191919" />
  <!-- Paper Document -->
  <rect x="28" y="16" width="544" height="388" fill="url(#paperBg)" stroke="#0d0d0d" stroke-width="3" />
  <rect x="38" y="26" width="524" height="368" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Intimidation Header -->
  <rect x="46" y="34" width="508" height="48" fill="#b42318" />
  <text x="300" y="57" text-anchor="middle" fill="#ffffff" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="18" letter-spacing="1.5">CENTRAL CYBER INVESTIGATION DESK (SIMULATED)</text>
  <text x="300" y="74" text-anchor="middle" fill="#fec917" font-family="Consolas, monospace" font-weight="700" font-size="11" letter-spacing="1">URGENT ORDER: DIGITAL ARREST &amp; CYBER LOCK NOTICE</text>

  <!-- Case Metadata Row -->
  <rect x="46" y="92" width="508" height="34" fill="#f3efe4" stroke="#0d0d0d" stroke-width="1" />
  <text x="58" y="113" fill="#0d0d0d" font-family="Consolas, monospace" font-weight="700" font-size="12">CASE NO: CCD/2026/88412</text>
  <text x="360" y="113" fill="#b42318" font-family="Consolas, monospace" font-weight="700" font-size="12">STATUS: CYBER LOCKED</text>

  <!-- Fictional Emblem Circle (Safe Generic Scale/Shield) -->
  <circle cx="96" cy="174" r="32" fill="none" stroke="#1e293b" stroke-width="2.5" />
  <circle cx="96" cy="174" r="25" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 2" />
  <polygon points="96,154 112,163 112,180 96,193 80,180 80,163" fill="#1e293b" />
  <text x="96" y="177" text-anchor="middle" fill="#fec917" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="11">DEMO</text>

  <!-- Body Text Lines (Authentic Scammer Formatting) -->
  <text x="144" y="154" fill="#0d0d0d" font-family="Arial, sans-serif" font-weight="700" font-size="13">SUBJECT: NON-BAILABLE WARRANT &amp; BANK ACCOUNT FREEZE</text>
  <rect x="144" y="165" width="390" height="7" fill="#334155" opacity="0.75" />
  <rect x="144" y="178" width="365" height="7" fill="#334155" opacity="0.65" />
  <rect x="144" y="191" width="382" height="7" fill="#334155" opacity="0.65" />

  <!-- Warning Box -->
  <rect x="46" y="220" width="340" height="84" fill="#fef3f2" stroke="#d92d20" stroke-width="2" />
  <text x="60" y="242" fill="#b42318" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="14">MANDATORY INSTRUCTIONS (FAKE SCAM TEXT):</text>
  <text x="60" y="262" fill="#1e1e1c" font-family="Arial, sans-serif" font-size="12">1. Remain alone on video surveillance.</text>
  <text x="60" y="280" fill="#1e1e1c" font-family="Arial, sans-serif" font-size="12">2. Do not contact family or bank branch.</text>
  <text x="60" y="296" fill="#1e1e1c" font-family="Arial, sans-serif" font-weight="700" font-size="12">3. Deposit ₹48,500 verification security now.</text>

  <!-- Red Rubber Stamp -->
  <g transform="translate(458, 256) rotate(-14)">
    <rect x="-74" y="-34" width="148" height="68" rx="4" fill="none" stroke="#d92d20" stroke-width="4" opacity="0.9" />
    <rect x="-68" y="-28" width="136" height="56" rx="2" fill="none" stroke="#d92d20" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="-4" text-anchor="middle" fill="#d92d20" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="17" letter-spacing="1">CYBER LOCKED</text>
    <text x="0" y="16" text-anchor="middle" fill="#d92d20" font-family="Consolas, monospace" font-weight="700" font-size="11">FORGED SCAM STAMP</text>
  </g>

  <!-- Bottom Signature & Barcode -->
  <line x1="46" y1="358" x2="210" y2="358" stroke="#0d0d0d" stroke-width="1.5" />
  <text x="46" y="375" fill="#5a5850" font-family="Consolas, monospace" font-size="11">FAKE OFFICER SIGN • SIMULATED</text>

  <!-- Decorative Barcode -->
  <g transform="translate(414, 330)">
    <rect x="0" y="0" width="4" height="38" fill="#0d0d0d" />
    <rect x="7" y="0" width="2" height="38" fill="#0d0d0d" />
    <rect x="12" y="0" width="6" height="38" fill="#0d0d0d" />
    <rect x="21" y="0" width="3" height="38" fill="#0d0d0d" />
    <rect x="28" y="0" width="7" height="38" fill="#0d0d0d" />
    <rect x="38" y="0" width="2" height="38" fill="#0d0d0d" />
    <rect x="44" y="0" width="5" height="38" fill="#0d0d0d" />
    <rect x="53" y="0" width="3" height="38" fill="#0d0d0d" />
    <rect x="60" y="0" width="6" height="38" fill="#0d0d0d" />
    <rect x="70" y="0" width="2" height="38" fill="#0d0d0d" />
    <rect x="76" y="0" width="4" height="38" fill="#0d0d0d" />
    <rect x="84" y="0" width="7" height="38" fill="#0d0d0d" />
    <rect x="95" y="0" width="3" height="38" fill="#0d0d0d" />
    <rect x="102" y="0" width="5" height="38" fill="#0d0d0d" />
    <rect x="112" y="0" width="4" height="38" fill="#0d0d0d" />
    <rect x="120" y="0" width="6" height="38" fill="#0d0d0d" />
  </g>
