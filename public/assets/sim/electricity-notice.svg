<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Fictional electricity disconnection message used for scam awareness training">
<rect width="640" height="480" fill="#e9eee9"/>
<rect x="60" y="20" width="520" height="440" rx="28" fill="#fff" stroke="#d4ddd6" stroke-width="2"/>
<rect x="60" y="20" width="520" height="76" rx="28" fill="#174d3d"/><path d="M60 70h520v26H60z" fill="#174d3d"/>
<circle cx="100" cy="59" r="20" fill="#e4f1e9"/><path d="M90 61h20M100 51v20" stroke="#174d3d" stroke-width="3"/>
<text x="132" y="55" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="19">Electricity support</text>
<text x="132" y="77" fill="#d3e5da" font-family="Arial,sans-serif" font-size="13">Unknown sender ? not verified</text>
<rect x="352" y="38" width="205" height="28" rx="14" fill="#fff1dc"/><text x="370" y="57" fill="#8b4d00" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">TRAINING SAMPLE</text>
<text x="82" y="126" fill="#68746d" font-family="Arial,sans-serif" font-size="13">Today ? 7:19 pm</text>
<rect x="82" y="144" width="442" height="170" rx="16" fill="#f4f6f3" stroke="#e1e6e1"/>
<text x="105" y="178" fill="#202824" font-family="Arial,sans-serif" font-size="17">Dear consumer, your power will be</text>
<text x="105" y="205" fill="#202824" font-family="Arial,sans-serif" font-size="17">disconnected at 9:30 pm because your</text>
<text x="105" y="232" fill="#202824" font-family="Arial,sans-serif" font-size="17">last bill was not updated. Call this</text>
<text x="105" y="259" fill="#202824" font-family="Arial,sans-serif" font-size="17">number now to avoid disconnection.</text>
<text x="105" y="291" fill="#68746d" font-family="Arial,sans-serif" font-size="12">Example wording adapted from an official scam alert.</text>
<rect x="82" y="326" width="442" height="68" rx="14" fill="#fff8e9" stroke="#e9d8ad"/>
<rect x="100" y="344" width="40" height="36" rx="7" fill="#f2d9ce"/><text x="110" y="368" fill="#9b321d" font-family="Arial,sans-serif" font-weight="700" font-size="12">APK</text>
<text x="155" y="354" fill="#202824" font-family="Arial,sans-serif" font-weight="700" font-size="14">Bill_Update.apk</text>
<text x="155" y="375" fill="#68746d" font-family="Arial,sans-serif" font-size="12">Unknown app file ? do not install</text>
<rect x="82" y="412" width="442" height="30" rx="15" fill="#f8e8df"/><text x="102" y="432" fill="#923c24" font-family="Arial,sans-serif" font-size="12" font-weight="700">Never call a number from a threatening message.</text>
</svg>